# AI-CLI Metadata Configuration
# Format: KEY=VALUE (pipe-separated for multiple values)
#
# Fields:
#   - name: Display name
#   - command: Binary command name
#   - description: Short description
#   - preferred_source: Primary installation method
#   - alt_sources: Alternative methods (pipe-separated)
#   - arch_pkg: Arch Linux package name
#   - aur_pkg: AUR package name
#   - debian_pkg: Debian/Ubuntu package name
#   - brew_pkg: Homebrew package name (macOS)
#   - npm_pkg: NPM package name
#   - pip_pkg: PyPI package name
#   - cargo_pkg: Cargo package name
#   - manual_install: Manual installation command/URL
#   - dependencies: Required dependencies (pipe-separated)
#   - api_key_var: Environment variable for API key
#   - api_key_url: URL to get API key
#   - config_location: Default config directory
#   - test_command: Command to verify installation

# ============================================================================
# GEMINI CLI
# ============================================================================
[GEMINI]
name=GEMINI
command=gemini
description=Google Gemini AI CLI client
preferred_source=pacman
alt_sources=brew|npm
arch_pkg=gemini-cli
aur_pkg=
debian_pkg=
brew_pkg=gemini-cli
npm_pkg=@google/gemini-cli
pip_pkg=
cargo_pkg=
manual_install=
dependencies=brew|nodejs
api_key_var=GEMINI_API_KEY
api_key_url=https://aistudio.google.com/apikey
config_location=~/gemini
test_command=gemini --version

# ============================================================================
# CLAUDE (Claude Code CLI)
# ============================================================================
[CLAUDE]
name=CLAUDE
command=claude
description=Anthropic Claude AI coding assistant
preferred_source=brew|npm|manual
alt_sources=
arch_pkg=
aur_pkg=
debian_pkg=
brew_pkg=--cask claude-code
npm_pkg=@anthropic-ai/claude-code
pip_pkg=
cargo_pkg=
manual_install=curl -fsSL https://claude.ai/install.sh | bash
dependencies=brew|nodejs
api_key_var=ANTHROPIC_API_KEY
api_key_url=https://console.anthropic.com/settings/keys
config_location=~/.claude/
test_command=claude --version

